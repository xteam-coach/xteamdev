<!-- Sign-in / Create account page (shown first, before sign-in) -->
<div id="auth">
  <div class="auth-card">
    <img id="authLogo" alt="XTeam logo">
    <h1>XTeam</h1>
    <p class="lead">Internal team portal. <br> Sign in to open your dashboard.</p>
    <label for="fEmail">Email</label><input id="fEmail" type="email" autocomplete="email">
    <label for="fPass">Password</label><input id="fPass" type="password" autocomplete="current-password">
    <p class="err" id="err" role="alert"></p>
    <div class="actions"><button class="btn primary" id="submit">Sign in</button></div>
  </div>
</div>
