<!-- Page: settings -->
<section data-view="settings" hidden>
    <h1>Account settings</h1>
    <p class="lead">Your sign-in details.</p>
    <div class="panel" style="max-width:420px">
      <label for="setName">Display name</label>
      <input id="setName" autocomplete="name">
      <label for="setEmail">Email</label>
      <input id="setEmail" disabled>
      <label for="setCoach">Coach ID</label>
      <input id="setCoach" disabled>
      <div class="actions"><button class="btn primary" id="saveName">Save changes</button></div>
    </div>
  </section>
